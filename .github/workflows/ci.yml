name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fast-feedback:
    name: Fast feedback (lint + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # SEV-N11 — actions pinned to immutable commit SHAs.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          # PERF-X12 — use the built-in GitHub-hosted npm cache keyed on
          # package-lock.json. Saves ~30-60 s on the install step when
          # the cache is warm. See doc/performance/perf-audit-cross-cutting.md.
          cache: "npm"

      - name: Install deps (cached)
        run: npm ci --foreground-scripts --prefer-offline --no-audit

      - name: Generate Prisma client (for typecheck)
        run: npx prisma generate
        working-directory: backend

      - name: Build matching package (typecheck dependency)
        run: npm run build -w @openmatch/matching

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

  lint-and-build:
    name: Lint, typecheck, build (Node)
    runs-on: ubuntu-latest
    steps:
      # SEV-N11 — actions pinned to immutable commit SHAs.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          # PERF-X12 — see fast-feedback job above.
          cache: "npm"

      - name: Install deps (with debug capture)
        run: |
          set +e
          echo "## node $(node --version) / npm $(npm --version)" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la package.json package-lock.json | tee -a "$GITHUB_STEP_SUMMARY"
          npm config get registry | tee -a "$GITHUB_STEP_SUMMARY"
          npm ci --foreground-scripts --loglevel=warn 2>&1 | tee /tmp/npmci.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "### npm ci failed (rc=$rc)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -200 /tmp/npmci.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo '--- falling back to npm install ---' | tee -a "$GITHUB_STEP_SUMMARY"
            npm install --no-audit --no-fund --foreground-scripts 2>&1 | tee /tmp/npminstall.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              echo "### npm install ALSO failed (rc=$rc)" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -200 /tmp/npminstall.log >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              exit $rc
            fi
          fi

      - name: Lint (Biome)
        run: npm run lint

      - name: Format check (Biome)
        run: npm run format:check

      # Round-A error-contract: docs/api/ERRORS.md is generated from
      # backend/src/lib/error-codes.ts. Regenerate it and fail the build
      # if anything differs — every code change must be accompanied by a
      # docs refresh in the same PR.
      - name: Verify error docs are up to date
        run: |
          node scripts/generate-error-docs.mjs
          git diff --exit-code docs/api/ERRORS.md

      # Round C — admin/lib/api/error-codes.ts is a generated mirror of
      # the backend registry. Regenerate it and fail if the working tree
      # changed; engineers who add a backend code must also commit the
      # regenerated admin file so the two stay byte-stable.
      - name: Verify admin error codes synced with backend
        run: |
          node scripts/sync-error-codes.mjs
          git diff --exit-code admin/lib/api/error-codes.ts

      # SEV-N12 — npm audit gate covers high-severity vulnerabilities
      # across BOTH production and dev dependency trees. The previous
      # gate was `--audit-level=critical --omit=dev`, which missed
      # (a) the critical happy-dom VM-escape RCE (devDep, ships in test
      # fixtures), and (b) every high-severity prod-dep advisory
      # (nodemailer, node-forge → @parse/node-apn, undici, etc.).
      #
      # Transitive issues are addressed via the npm `overrides` field in
      # the root package.json so a single CI run pulls patched versions
      # without waiting for upstream releases of @vercel/node / @parse/
      # node-apn.
      - name: Audit for high-severity vulns (prod + dev)
        run: |
          set +e
          npm audit --audit-level=high > /tmp/audit.txt 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "## npm audit failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/audit.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit $rc
          fi

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      # @openmatch/backend imports the @openmatch/matching workspace,
      # which resolves to matching/dist/index.d.ts via its "types" field.
      # Build matching first so the backend's tsc --noEmit can resolve it.
      - name: Build matching package
        run: npm run build -w @openmatch/matching

      - name: Typecheck
        run: npm run typecheck

      - name: License inventory (compliance)
        run: npm run license-inventory

      - name: Build backend
        run: npm run build -w @openmatch/backend

  admin-dashboard:
    name: Lint + typecheck admin dashboard
    runs-on: ubuntu-latest
    steps:
      # SEV-N11 — actions pinned to immutable commit SHAs.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .nvmrc
          # PERF-X12 — see fast-feedback job above.
          cache: "npm"

      - name: Install deps (with debug capture)
        run: |
          set +e
          echo "## node $(node --version) / npm $(npm --version)" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la package.json package-lock.json | tee -a "$GITHUB_STEP_SUMMARY"
          npm config get registry | tee -a "$GITHUB_STEP_SUMMARY"
          npm ci --foreground-scripts --loglevel=warn 2>&1 | tee /tmp/npmci.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "### npm ci failed (rc=$rc)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -200 /tmp/npmci.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo '--- falling back to npm install ---' | tee -a "$GITHUB_STEP_SUMMARY"
            npm install --no-audit --no-fund --foreground-scripts 2>&1 | tee /tmp/npminstall.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              echo "### npm install ALSO failed (rc=$rc)" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -200 /tmp/npminstall.log >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              exit $rc
            fi
          fi

      - name: Generate Prisma client (for shared types)
        run: npx prisma generate
        working-directory: backend

      - name: Typecheck admin
        run: npm run typecheck -w @openmatch/admin

      - name: Lint admin
        run: npm run lint -w @openmatch/admin

      - name: Test admin (with coverage)
        run: npm test -w @openmatch/admin -- --coverage

      - name: Upload admin coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admin-coverage
          path: admin/coverage/
          retention-days: 7

      # PERF-A12 — catch RSC boundary violations, bundle / tree-shaking
      # regressions, and font subsetting failures in CI instead of on
      # Vercel preview deploys. Build does not need a live backend; we
      # provide placeholder values for the few env vars next build reads.
      - name: Build admin dashboard
        env:
          ADMIN_API_BASE_URL: http://localhost:0
          ADMIN_SESSION_SECRET: ci-only-secret-not-real-must-be-32-bytes-long
        run: npm run build -w @openmatch/admin

  test-matching:
    name: Test @openmatch/matching
    runs-on: ubuntu-latest
    steps:
      # SEV-N11 — actions pinned to immutable commit SHAs.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          # PERF-X12 — see fast-feedback job above.
          cache: "npm"

      - name: Install deps (with debug capture)
        run: |
          set +e
          echo "## node $(node --version) / npm $(npm --version)" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la package.json package-lock.json | tee -a "$GITHUB_STEP_SUMMARY"
          npm config get registry | tee -a "$GITHUB_STEP_SUMMARY"
          npm ci --foreground-scripts --loglevel=warn 2>&1 | tee /tmp/npmci.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "### npm ci failed (rc=$rc)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -200 /tmp/npmci.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo '--- falling back to npm install ---' | tee -a "$GITHUB_STEP_SUMMARY"
            npm install --no-audit --no-fund --foreground-scripts 2>&1 | tee /tmp/npminstall.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              echo "### npm install ALSO failed (rc=$rc)" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -200 /tmp/npminstall.log >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              exit $rc
            fi
          fi

      - name: Test matching (with coverage)
        run: npm test -w @openmatch/matching -- --coverage

      - name: Upload matching coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: matching-coverage
          path: matching/coverage/
          retention-days: 7

      - name: Post matching coverage summary
        if: always()
        run: |
          {
            echo "## Matching coverage"
            echo '```'
            if [ -f matching/coverage/coverage-summary.json ]; then
              node -e "const d=require('./matching/coverage/coverage-summary.json').total; console.log(JSON.stringify(d,null,2));"
            else
              echo "no summary file"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test-backend:
    name: Test @openmatch/backend (Postgres + PostGIS)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: openmatch
          POSTGRES_PASSWORD: openmatch
          POSTGRES_DB: openmatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openmatch -d openmatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://openmatch:openmatch@localhost:5432/openmatch?schema=public
      # Realtime / cache services are intentionally unset in CI. The
      # backend plugins fall back to no-ops (Upstash → null, Ably →
      # null), which is the correct behavior for hermetic tests.
      JWT_SECRET: ci-only-secret-not-a-real-secret-do-not-use
      NODE_ENV: test
      ALLOW_DEV_LOGIN: "false"

    steps:
      # SEV-N11 — actions pinned to immutable commit SHAs.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          # PERF-X12 — see fast-feedback job above.
          cache: "npm"

      - name: Install deps (with debug capture)
        run: |
          set +e
          echo "## node $(node --version) / npm $(npm --version)" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la package.json package-lock.json | tee -a "$GITHUB_STEP_SUMMARY"
          npm config get registry | tee -a "$GITHUB_STEP_SUMMARY"
          npm ci --foreground-scripts --loglevel=warn 2>&1 | tee /tmp/npmci.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "### npm ci failed (rc=$rc)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -200 /tmp/npmci.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo '--- falling back to npm install ---' | tee -a "$GITHUB_STEP_SUMMARY"
            npm install --no-audit --no-fund --foreground-scripts 2>&1 | tee /tmp/npminstall.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              echo "### npm install ALSO failed (rc=$rc)" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              tail -200 /tmp/npminstall.log >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              exit $rc
            fi
          fi

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend

      # backend/src/server.ts imports @openmatch/matching, whose package
      # entry is matching/dist/index.js. Build it before vitest spins up
      # the server in tests.
      - name: Build matching package
        run: npm run build -w @openmatch/matching

      - name: Apply Prisma migrations
        working-directory: backend
        run: |
          set +e
          npx prisma migrate deploy 2>&1 | tee /tmp/migrate.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "### Prisma migrate deploy failed (rc=$rc)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -200 /tmp/migrate.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit $rc
          fi

      - name: Run backend tests (with coverage)
        id: backend_tests
        env:
          ADMIN_JWT_SECRET: ci-only-admin-secret-not-a-real-secret
        run: |
          set +e
          npm test -w @openmatch/backend -- --coverage 2>&1 | tee /tmp/vitest.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "### Backend vitest failed (rc=$rc)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -300 /tmp/vitest.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit $rc
          fi

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

      - name: Post backend coverage summary
        if: always()
        run: |
          {
            echo "## Backend coverage"
            echo '```'
            if [ -f backend/coverage/coverage-summary.json ]; then
              node -e "const d=require('./backend/coverage/coverage-summary.json').total; console.log(JSON.stringify(d,null,2));"
            else
              echo "no summary file"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Post test failure as PR comment
        if: failure() && steps.backend_tests.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Backend vitest failure (run ${{ github.run_id }})"
            echo ""
            echo '```'
            tail -300 /tmp/vitest.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file /tmp/comment.md
