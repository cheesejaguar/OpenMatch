name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: xcodebuild build (generic simulator)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          which xcodegen || echo "xcodegen not installed yet"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
          key: swiftpm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: List schemes
        working-directory: ios
        run: xcodebuild -project OpenMatch.xcodeproj -list

      - name: Build
        id: build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project OpenMatch.xcodeproj \
            -scheme OpenMatch \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/DerivedData \
            build 2>&1 | tee /tmp/xcodebuild.log

      - name: Annotate compiler errors on failure
        if: failure()
        run: |
          while IFS= read -r line; do
            echo "::error::${line}"
          done < <(grep -E "error:|\\*\\* BUILD FAILED \\*\\*" /tmp/xcodebuild.log | head -50)

      - name: Publish build log on failure
        if: failure()
        run: |
          {
            echo "## xcodebuild build failed"
            echo ""
            echo "### error/warning lines"
            echo '```'
            grep -E "error:|warning:|\*\* BUILD FAILED \*\*" /tmp/xcodebuild.log | head -200 || true
            echo '```'
            echo ""
            echo "### last 200 lines of full log"
            echo '```'
            tail -n 200 /tmp/xcodebuild.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          retention-days: 7

  test:
    name: xcodebuild test (booted simulator)
    runs-on: macos-latest
    needs: build
    timeout-minutes: 30
    if: ${{ success() }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          xcrun simctl list devices available | tee /tmp/simlist.txt
          DEVICE=$(grep -E "iPhone [0-9]+( Pro| Plus| Pro Max)?( \(.*\))?" /tmp/simlist.txt \
            | grep -v "unavailable" \
            | head -1 \
            | sed -E 's/^[[:space:]]+([^(]+)[[:space:]]+\(.*$/\1/' \
            | xargs)
          if [ -z "$DEVICE" ]; then
            DEVICE="iPhone 16"
          fi
          echo "Selected simulator: '$DEVICE'"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      # Unit tests run WITH coverage instrumentation so we can graph
      # per-file iOS coverage over time. Coverage adds significant runtime
      # overhead — UITests run separately, without it, in a follow-up step.
      - name: Test (unit, with coverage)
        working-directory: ios
        env:
          DEVICE: ${{ steps.sim.outputs.device }}
        run: |
          set -o pipefail
          xcodebuild \
            -project OpenMatch.xcodeproj \
            -scheme OpenMatch \
            -destination "platform=iOS Simulator,name=$DEVICE,OS=latest" \
            -configuration Debug \
            -enableCodeCoverage YES \
            -only-testing:OpenMatchTests \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee /tmp/xcodebuild-test.log

      # UITests run WITHOUT coverage — booted-simulator launch under
      # coverage instrumentation runs ~3× slower and trips the auto-login
      # smoke test's 60 s polling deadline. We accept lower visibility on
      # UI-layer coverage in exchange for a stable XCUITest signal.
      - name: Test (UI, no coverage)
        working-directory: ios
        env:
          DEVICE: ${{ steps.sim.outputs.device }}
        run: |
          set -o pipefail
          xcodebuild \
            -project OpenMatch.xcodeproj \
            -scheme OpenMatch \
            -destination "platform=iOS Simulator,name=$DEVICE,OS=latest" \
            -configuration Debug \
            -only-testing:OpenMatchUITests \
            -derivedDataPath build/DerivedData-ui \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee -a /tmp/xcodebuild-test.log

      # Round C — surface iOS line coverage in the GitHub step summary so
      # we can graph it over time. No threshold is enforced yet; the goal
      # is measurement first, gate later.
      - name: Extract iOS coverage
        if: always()
        working-directory: ios
        run: |
          set +e
          XCRESULT=$(find build/DerivedData/Logs/Test -name "*.xcresult" -maxdepth 2 | head -1)
          if [ -z "$XCRESULT" ]; then
            echo "no xcresult found" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          xcrun xccov view --report --json "$XCRESULT" > /tmp/xccov.json || true
          LINE_COV=$(jq '.targets[] | select(.name == "OpenMatch") | .lineCoverage' /tmp/xccov.json 2>/dev/null)
          {
            echo "## iOS coverage"
            echo "OpenMatch line coverage: ${LINE_COV:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload iOS coverage
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ios-coverage
          path: /tmp/xccov.json
          retention-days: 7

      - name: Annotate test failures
        if: failure()
        run: |
          while IFS= read -r line; do
            echo "::error::${line}"
          done < <(grep -E "error:|Test Case.*failed|\\*\\* TEST FAILED \\*\\*" /tmp/xcodebuild-test.log | head -50)

      - name: Publish test log on failure
        if: failure()
        run: |
          {
            echo "## xcodebuild test failed"
            echo ""
            echo "### errors and failed test cases"
            echo '```'
            grep -E "error:|Test Case.*failed|\*\* TEST FAILED \*\*|failed:" /tmp/xcodebuild-test.log | head -200 || true
            echo '```'
            echo ""
            echo "### last 300 lines of full log"
            echo '```'
            tail -n 300 /tmp/xcodebuild-test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full test log
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: xcodebuild-test-log
          path: /tmp/xcodebuild-test.log
          retention-days: 7
